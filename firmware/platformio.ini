; Table saw thermal protection supervisor — build configuration.
;
; Quick start on a Mac, from firmware/:
;
;   pio test -e native                 run the safety-logic unit tests on the host
;   pio run  -e path_a                 build the parts-on-hand build (BUILD-TONIGHT.md)
;   pio run  -e path_a -t upload       flash it
;   pio device monitor                 watch the serial log
;
; Or let the script do all of it, including finding the port and matching the partition
; table to the board's actual flash size:  ./scripts/flash.sh all
;
; ENVIRONMENTS
;
;   path_a       DROK NTC on the motor frame + 433 MHz fob heartbeat.  4 MB flash.
;   path_a_8mb   same, for a board with 8 MB flash and a longer log ring.
;   path_b       K-type via MAX31855 at the winding + wired relay.     4 MB flash.
;   path_b_8mb   same, 8 MB.
;   native       host build of lib/saw_core for `pio test`. No hardware needed.
;
; The 4 MB layouts are the default because they boot on either chip; an 8 MB partition
; table on a 4 MB part does not boot at all. `scripts/flash.sh` reads the real flash size
; with esptool and picks for you.

[platformio]
default_envs = path_a
src_dir = src
include_dir = include
lib_dir = lib
test_dir = test

[env]
platform = espressif32@^6.9.0
framework = arduino
board = esp32dev
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder
upload_speed = 460800

; generated/error_codes.h is built from docs/codes/ by tools/codedocs.py and committed,
; so the firmware compiles with no Python toolchain present.
;
; SAW_EXTRA_FLAGS is the commissioning hook. Every constant in include/saw_config.h is
; #ifndef-guarded, so a -D on the command line wins over the tracked default without
; editing source:
;
;   SAW_EXTRA_FLAGS="-DSAW_TRIP_C=95 -DSAW_WARN_C=85" pio run -e path_a -t upload
;
; It resolves to nothing when unset, which is the normal case.
build_flags =
    ${sysenv.SAW_EXTRA_FLAGS}
    -I $PROJECT_DIR/generated
    -I $PROJECT_DIR/lib/saw_core
    -Wall
    -Wextra
    -Wno-unused-parameter

check_tool = cppcheck
check_flags = cppcheck: --enable=warning,style --inline-suppr --suppress=missingInclude

[esp32_common]
extends = env
board_build.filesystem = littlefs

[env:path_a]
extends = esp32_common
board_build.partitions = partitions_4mb.csv
build_flags =
    ${env.build_flags}
    -DSAW_PATH_A=1
    -DSAW_LOG_PERIOD_S=120
    -DSAW_LOG_RING_BYTES=360000UL

[env:path_a_8mb]
extends = esp32_common
board_upload.flash_size = 8MB
board_build.partitions = partitions_8mb.csv
build_flags =
    ${env.build_flags}
    -DSAW_PATH_A=1
    -DSAW_LOG_PERIOD_S=60
    -DSAW_LOG_RING_BYTES=720000UL

[env:path_b]
extends = esp32_common
board_build.partitions = partitions_4mb.csv
build_flags =
    ${env.build_flags}
    -DSAW_PATH_B=1
    -DSAW_LOG_PERIOD_S=120
    -DSAW_LOG_RING_BYTES=360000UL

[env:path_b_8mb]
extends = esp32_common
board_upload.flash_size = 8MB
board_build.partitions = partitions_8mb.csv
build_flags =
    ${env.build_flags}
    -DSAW_PATH_B=1
    -DSAW_LOG_PERIOD_S=60
    -DSAW_LOG_RING_BYTES=720000UL

; The protection core with no Arduino under it. This is the environment that proves the
; state machine, the trip counter, the SR-5 validation rules, the NTC maths and the LED
; patterns behave, and it runs in about a second on a laptop.
[env:native]
platform = native
test_framework = unity
build_flags =
    -I $PROJECT_DIR/lib/saw_core
    -I $PROJECT_DIR/generated
    -std=c++11
    -Wall
    -Wextra
    -Wno-unused-parameter
    -DSAW_HOST_TEST=1
lib_compat_mode = off
lib_deps = saw_core
