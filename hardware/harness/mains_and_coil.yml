# Wireviz source for the mains-side wiring: PSU tap and coil circuit.
# Both live inside the starter enclosure alongside the ESP32 supervisor.
# Render:  wireviz hardware/harness/mains_and_coil.yml
# Requires: graphviz + wireviz (see hardware/harness/README.md)
#
# PATH B TARGET. Neither the isolated PSU module (TASK-2), the dry
# GPIO-driven relay module (TASK-3), nor the bimetallic thermostat
# (TASK-6) has been purchased. For the mains-side wiring that can be
# built from parts on hand, see pathA_fob_and_receiver.yml — the
# purchased RF receiver is line-powered and lands quite differently.

metadata:
  title: Mains tap + coil circuit after retrofit (Path B target)
  description: |
    Both new protective contacts (bimetallic thermostat, ESP32 relay) sit
    in series with the contactor coil. The isolated PSU is tapped in
    parallel with L1/L2 upstream of the contactor, downstream of the
    disconnect. Motor line current is NOT shown — it goes straight
    through the contactor's main power contacts.

    None of the three added parts on this sheet is on hand. This is the
    end-state design, not a build sheet.

options:
  fontname: sans-serif
  bgcolor: white
  color_mode: full

connectors:
  DISC:
    type: Machine disconnect
    subtype: 2P breaker
    pincount: 2
    pinlabels: [L1, L2]
    notes: Lockout-tagout point. All work downstream requires this open.
  FUSE:
    type: Fast-blow fuse
    subtype: 250 mA, 5x20 mm
    pincount: 2
    pinlabels: [in, out]
  PSU:
    type: Isolated AC-DC PSU
    subtype: Mean Well IRM-05-5 or equivalent
    pincount: 4
    pinlabels: [AC-L, AC-N, +5V, GND]
    notes: Reinforced isolation, 85–305 VAC in, 5 VDC out.
  TB_ESP:
    type: Terminal block into ESP enclosure
    pincount: 2
    pinlabels: [+5V, GND]
  # Coil circuit chain (all NC / momentary-through when not tripped):
  SEAL:
    type: Starter seal-in output
    subtype: A202C aux + coil path
    pincount: 1
    pinlabels: [out]
  TSTAT:
    type: Bimetallic thermostat
    subtype: NC, opens 120–130 °C, auto-reset
    pincount: 2
    pinlabels: [in, out]
  RLY:
    type: ESP32 supervisor relay
    subtype: NO, energized-to-close, opto-isolated module (TASK-3)
    pincount: 3
    # "NO" MUST stay quoted. YAML 1.1 parses a bare NO as boolean false,
    # which reaches wireviz as a non-string pinlabel and crashes the
    # render with `TypeError: sequence item 2: expected str instance,
    # bool found`. Same trap applies to ON/OFF/YES/Y/N.
    pinlabels: [COM, "NO", NC]
    notes: |
      NC left unconnected.

      This is a DRY three-terminal relay module, which is what makes the
      between-the-seal-in-and-the-coil position valid. The purchased
      VONVOFF receiver (B07CTL3TG6) is NOT this part: it is line-powered,
      needs its own supply across the control rails, and may not offer a
      dry contact at all. Do not substitute one for the other here — see
      pathA_fob_and_receiver.yml.
  COIL:
    type: Contactor coil
    subtype: A202C 120/240 V AC coil
    pincount: 2
    pinlabels: [+, -]
  OL:
    type: Overload contact
    subtype: NC, ambient-compensated
    pincount: 2
    pinlabels: [in, out]
  L2RTN:
    type: L2 return busbar
    pincount: 1
    pinlabels: [L2]

cables:
  # Mains tap side
  L1_TAP:
    gauge: 18 AWG
    length: 0.3
    wirecount: 1
    colors: [BK]
  FUSE_TO_PSU:
    gauge: 18 AWG
    length: 0.2
    wirecount: 1
    colors: [BK]
  L2_TAP:
    gauge: 18 AWG
    length: 0.3
    wirecount: 1
    colors: [WH]
  PSU_OUT:
    gauge: 20 AWG
    length: 0.3
    wirecount: 2
    colors: [RD, BK]

  # Coil circuit chain
  W_SEAL_TSTAT:
    gauge: 16 AWG
    length: 0.3
    wirecount: 1
    colors: [BK]
  W_TSTAT_RLY:
    gauge: 16 AWG
    length: 0.3
    wirecount: 1
    colors: [BK]
  W_RLY_COIL:
    gauge: 16 AWG
    length: 0.3
    wirecount: 1
    colors: [BK]
  W_COIL_OL:
    gauge: 16 AWG
    length: 0.3
    wirecount: 1
    colors: [BK]
  W_OL_L2:
    gauge: 16 AWG
    length: 0.3
    wirecount: 1
    colors: [WH]

connections:
  # ----- PSU tap in parallel with the motor supply -----
  - - DISC: [1]
    - L1_TAP: [1]
    - FUSE: [1]
  - - FUSE: [2]
    - FUSE_TO_PSU: [1]
    - PSU: [1]
  - - DISC: [2]
    - L2_TAP: [1]
    - PSU: [2]
  - - PSU: [3, 4]
    - PSU_OUT: [1, 2]
    - TB_ESP: [1, 2]

  # ----- Coil circuit: seal-in → TSTAT → RLY → coil → OL → L2 -----
  - - SEAL: [1]
    - W_SEAL_TSTAT: [1]
    - TSTAT: [1]
  - - TSTAT: [2]
    - W_TSTAT_RLY: [1]
    - RLY: [1]        # COM
  - - RLY: [2]        # NO
    - W_RLY_COIL: [1]
    - COIL: [1]
  - - COIL: [2]
    - W_COIL_OL: [1]
    - OL: [1]
  - - OL: [2]
    - W_OL_L2: [1]
    - L2RTN: [1]
