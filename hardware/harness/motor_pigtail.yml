# Wireviz source for the pigtail leaving the motor: K-type thermocouple
# leads at the winding plus the two thermostat leads. Both sets exit
# through a common strain relief, run through conduit to the starter
# enclosure, and land on a connector for the supervisor board.
#
# Render:  wireviz hardware/harness/motor_pigtail.yml

metadata:
  title: Motor sensor pigtail
  description: |
    Leaves the Marathon SXA145TBFR motor through the existing conduit
    entry. K-type junction bonded to end turns via AlN substrate;
    thermostat bonded to end turns on the opposite side. Both sets of
    leads must be PTFE- or fiberglass-insulated for winding-temperature
    class and 600 V rating (see TASK-4 in ARCHITECTURE.md).

options:
  fontname: sans-serif
  bgcolor: white
  color_mode: full

connectors:
  MOTOR:
    type: Motor internals
    subtype: Marathon SXA145TBFR7002AA
    pincount: 4
    pinlabels: [TC+, TC-, TS1, TS2]
    notes: |
      TC = K-type junction on end turns (AlN interface).
      TS = bimetallic thermostat, NC, opens 120–130 °C, opposite side.
  SR:
    type: Strain relief at motor
    subtype: PG cable gland, EPDM
    pincount: 4
    pinlabels: [TC+, TC-, TS1, TS2]
  ENC:
    type: Enclosure terminal block
    subtype: 4-way, screw + ring
    pincount: 4
    pinlabels: [TC+, TC-, TS1, TS2]
    notes: TC pair → MAX31855 T+/T-. TS pair → coil-circuit thermostat.

cables:
  # Two separate cables sharing the conduit run. Kept separate to keep
  # thermocouple compensation continuous (K-type extension all the way).
  KTYPE:
    gauge: 24 AWG
    length: 3.0
    wirecount: 2
    colors: [YE, RD]
    notes: |
      K-type extension wire. Yellow = TC+ (chromel), red = TC- (alumel).
      PTFE jacket. Do NOT substitute copper — the junction reference
      will shift and MAX31855 CJC will not compensate correctly.
  TSTAT_LEADS:
    gauge: 18 AWG
    length: 3.0
    wirecount: 2
    colors: [BK, BK]
    notes: |
      Fiberglass-insulated, 600 V, 200 °C. Non-polarized (thermostat
      is a switch, not a diode). Runs alongside K-type but not twisted.

connections:
  - - MOTOR: [1, 2]        # TC+, TC-
    - KTYPE: [1, 2]
    - SR: [1, 2]
  - - SR: [1, 2]
    - KTYPE: [1, 2]        # continuation through conduit (represented as same cable)
    - ENC: [1, 2]
  - - MOTOR: [3, 4]        # TS1, TS2
    - TSTAT_LEADS: [1, 2]
    - SR: [3, 4]
  - - SR: [3, 4]
    - TSTAT_LEADS: [1, 2]
    - ENC: [3, 4]
