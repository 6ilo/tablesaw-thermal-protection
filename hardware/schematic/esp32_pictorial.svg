<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xml:lang="en" height="738.5999999999999pt" width="1269.1999999999998pt" viewBox="-562.6 -274.6 1269.1999999999998 738.5999999999999"><path d="M -126.0,126.0 L 126,126 L 126,-126 L -126,-126 L -126,126" style="stroke:black;fill:#f7f7f7;stroke-width:1.5;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 126.0,-36.0 L 306,-36 L 306,-126 L 126,-126 L 126,-36" style="stroke:black;fill:#fef7ea;stroke-width:1.5;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 126.0,90.0 L 306,90 L 306,18 L 126,18 L 126,90" style="stroke:black;fill:#fdecea;stroke-width:1.5;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 126.0,288.0 L 306,288 L 306,144 L 126,144 L 126,288" style="stroke:black;fill:#eaf4fb;stroke-width:1.5;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M -558.0,-18.0 L -378,-18 L -378,-144 L -558,-144 L -558,-18" style="stroke:black;fill:#f4eafb;stroke-width:1.5;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M -486.0,288.0 L -342,288 L -342,216 L -486,216 L -486,288" style="stroke:black;fill:#eeeeee;stroke-width:1.5;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 126.0,54.0 L 63,54 L 63,36 L 0,36" style="stroke:#d62728;fill:none;stroke-width:3;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 0.0,90.0 L 72,54 L 72,-99 L 108,-99 L 108,-91.8 L 126,-81" style="stroke:#ff7f0e;fill:none;stroke-width:2;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 396.0,-36.0 L 396,-270 L -43.2,-270 L -54,-208.8" style="stroke:#ff7f0e;fill:none;stroke-width:2;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 324.0,72.0 L 360,72 L 360,162 L 450,162" style="stroke:#000000;fill:none;stroke-width:2;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 324.0,-108.0 L 387,-108 L 387,-171 L 450,-171" style="stroke:#bcbd22;fill:none;stroke-width:2;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 630.0,-171.0 L 702,-171" style="stroke:#bcbd22;fill:none;stroke-width:2;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M -54.0,-133.20000000000002 L 9,-133.2 L 9,-108 L 72,-108" style="stroke:#9467bd;fill:none;stroke-width:2;stroke-dasharray:7.4,3.2;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 72.0,-36.0 L 18,-36 L 18,108 L 414,108 L 414,90 L 450,90" style="stroke:#8c564b;fill:none;stroke-width:2;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 18.0,108.0 L 414,108" style="stroke:#8c564b;fill:none;stroke-width:2;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 349.2,-54.0 L 349.2,126 L 450,126" style="stroke:#d62728;fill:none;stroke-width:2;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 72.0,54.0 L 54,54 L 54,162 L -18,162" style="stroke:#7f7f7f;fill:none;stroke-width:2;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><text x="3.6" y="-28.6" dominant-baseline="central" fill="black" font-size="10" font-family="sans" text-anchor="middle"><tspan x="3.6" dy="10">ESP32-DevKitC-32E</tspan><tspan x="3.6" dy="10" /><tspan x="3.6" dy="10">(pin map: see WIRING.md</tspan><tspan x="3.6" dy="10">and esp32_supervisor.svg)</tspan></text><text x="135.0" y="-105.60000000000001" dominant-baseline="central" fill="#7f7f7f" font-size="8" font-family="sans" text-anchor="start"><tspan x="135.0" dy="8">(SPI:</tspan><tspan x="135.0" dy="8"> GPIO18/19/5)</tspan></text><text x="135.0" y="-47.6" dominant-baseline="central" fill="#7f7f7f" font-size="8" font-family="sans" text-anchor="start"><tspan x="135.0" dy="8">(VIN)</tspan></text><text x="135.0" y="6.4" dominant-baseline="central" fill="#7f7f7f" font-size="8" font-family="sans" text-anchor="start"><tspan x="135.0" dy="8">(3V3)</tspan></text><text x="135.0" y="78.39999999999999" dominant-baseline="central" fill="#7f7f7f" font-size="8" font-family="sans" text-anchor="start"><tspan x="135.0" dy="8">(GND)</tspan></text><text x="-127.8" y="-101.60000000000001" dominant-baseline="central" fill="#7f7f7f" font-size="8" font-family="sans" text-anchor="end"><tspan x="-127.8" dy="8">(GPIO34)</tspan></text><text x="-127.8" y="-29.599999999999998" dominant-baseline="central" fill="#7f7f7f" font-size="8" font-family="sans" text-anchor="end"><tspan x="-127.8" dy="8">(GPIO26)</tspan></text><text x="-127.8" y="60.39999999999999" dominant-baseline="central" fill="#7f7f7f" font-size="8" font-family="sans" text-anchor="end"><tspan x="-127.8" dy="8">(GPIO27)</tspan></text><text x="345.59999999999997" y="-176.6" dominant-baseline="central" fill="black" font-size="10" font-family="sans" text-anchor="middle"><tspan x="345.59999999999997" dy="10">MAX31855</tspan><tspan x="345.59999999999997" dy="10">K-type breakout</tspan><tspan x="345.59999999999997" dy="10">(3V3, SPI)</tspan></text><text x="345.59999999999997" y="-41.599999999999994" dominant-baseline="central" fill="black" font-size="10" font-family="sans" text-anchor="middle"><tspan x="345.59999999999997" dy="10">Isolated AC-DC PSU</tspan><tspan x="345.59999999999997" dy="10">5 V SELV</tspan><tspan x="345.59999999999997" dy="10">(Mean Well IRM-05-5)</tspan></text><text x="345.59999999999997" y="110.4" dominant-baseline="central" fill="black" font-size="10" font-family="sans" text-anchor="middle"><tspan x="345.59999999999997" dy="10">Relay module</tspan><tspan x="345.59999999999997" dy="10">(opto-isolated,</tspan><tspan x="345.59999999999997" dy="10">active-HIGH, NO)</tspan><tspan x="345.59999999999997" dy="10" /><tspan x="345.59999999999997" dy="10">=&gt; coil circuit</tspan></text><text x="442.79999999999995" y="128.4" dominant-baseline="central" fill="black" font-size="8" font-family="sans" text-anchor="start"><tspan x="442.79999999999995" dy="8">COM, NO</tspan><tspan x="442.79999999999995" dy="8">=&gt; thermostat + M1 coil</tspan></text><text x="-338.40000000000003" y="-181.6" dominant-baseline="central" fill="black" font-size="10" font-family="sans" text-anchor="middle"><tspan x="-338.40000000000003" dy="10">NTC frame divider</tspan><tspan x="-338.40000000000003" dy="10">3V3 - 10k pullup - node</tspan><tspan x="-338.40000000000003" dy="10">              - NTC - GND</tspan><tspan x="-338.40000000000003" dy="10">(node = GPIO34)</tspan></text><text x="-284.40000000000003" y="156.4" dominant-baseline="central" fill="black" font-size="10" font-family="sans" text-anchor="middle"><tspan x="-284.40000000000003" dy="10">ACK button</tspan><tspan x="-284.40000000000003" dy="10">(momentary,</tspan><tspan x="-284.40000000000003" dy="10">to GND)</tspan></text><text x="165.6" y="-36.8" dominant-baseline="central" fill="#d62728" font-size="8" font-family="sans" text-anchor="start"><tspan x="165.6" dy="8">+5V (red)</tspan></text><text x="205.2" y="-40.4" dominant-baseline="central" fill="#ff7f0e" font-size="8" font-family="sans" text-anchor="start"><tspan x="205.2" dy="8">3V3 (orange)</tspan></text><text x="169.2" y="89.19999999999999" dominant-baseline="central" fill="#000000" font-size="8" font-family="sans" text-anchor="start"><tspan x="169.2" dy="8">GND common (black)</tspan></text><text x="183.6" y="-124.39999999999999" dominant-baseline="central" fill="black" font-size="8" font-family="sans" text-anchor="start"><tspan x="183.6" dy="8">SPI bundle:</tspan><tspan x="183.6" dy="8"> SCK (yellow)</tspan><tspan x="183.6" dy="8"> MISO (green)</tspan><tspan x="183.6" dy="8"> CS (blue)</tspan></text><text x="511.2" y="-172.6" dominant-baseline="central" fill="black" font-size="8" font-family="sans" text-anchor="start"><tspan x="511.2" dy="8">TC+ / TC- =&gt;</tspan><tspan x="511.2" dy="8">winding K-type</tspan><tspan x="511.2" dy="8">(via harness)</tspan></text><text x="-241.20000000000002" y="-141.6" dominant-baseline="central" fill="#9467bd" font-size="8" font-family="sans" text-anchor="start"><tspan x="-241.20000000000002" dy="8">GPIO34 (purple,</tspan><tspan x="-241.20000000000002" dy="8">dashed = via divider)</tspan></text><text x="219.6" y="66.8" dominant-baseline="central" fill="#8c564b" font-size="8" font-family="sans" text-anchor="middle"><tspan x="219.6" dy="8">GPIO26 (brown)</tspan><tspan x="219.6" dy="8">+ 10k pulldown</tspan><tspan x="219.6" dy="8"> at relay IN</tspan></text><text x="-143.99999999999997" y="67.19999999999999" dominant-baseline="central" fill="#7f7f7f" font-size="8" font-family="sans" text-anchor="end"><tspan x="-143.99999999999997" dy="8">GPIO27</tspan><tspan x="-143.99999999999997" dy="8">(grey)</tspan></text><text x="-428.40000000000003" y="314.40000000000003" dominant-baseline="central" fill="#333" font-size="10" font-family="sans" text-anchor="start"><tspan x="-428.40000000000003" dy="10">Wire colour code (breadboard convention)</tspan><tspan x="-428.40000000000003" dy="10" /><tspan x="-428.40000000000003" dy="10">  red     +5 V rail from PSU</tspan><tspan x="-428.40000000000003" dy="10">  orange  3V3 rail (regulated on the DevKitC)</tspan><tspan x="-428.40000000000003" dy="10">  black   GND / common bus</tspan><tspan x="-428.40000000000003" dy="10">  yellow  SPI SCK  (and MAX31855 TC leads)</tspan><tspan x="-428.40000000000003" dy="10">  green   SPI MISO</tspan><tspan x="-428.40000000000003" dy="10">  blue    SPI CS</tspan><tspan x="-428.40000000000003" dy="10">  purple  ADC1 input (GPIO34, dashed = via divider)</tspan><tspan x="-428.40000000000003" dy="10">  brown   relay drive (GPIO26)</tspan><tspan x="-428.40000000000003" dy="10">  grey    ack button, LED annotation</tspan></text><text x="3.6" y="284.40000000000003" dominant-baseline="central" fill="#333" font-size="10" font-family="sans" text-anchor="start"><tspan x="3.6" dy="10">Physical build notes</tspan><tspan x="3.6" dy="10" /><tspan x="3.6" dy="10">  * Full pin table is in WIRING.md (same directory).</tspan><tspan x="3.6" dy="10">  * GPIO34 is INPUT-ONLY; do not use it for outputs.</tspan><tspan x="3.6" dy="10">  * ADC2 pins (GPIO0/2/4/12-15/25-27) are unusable while Wi-Fi</tspan><tspan x="3.6" dy="10">    is active. The NTC MUST be on ADC1 (GPIO32-39).</tspan><tspan x="3.6" dy="10">  * GPIO26 needs an external 10 kOhm pulldown at the relay IN pin</tspan><tspan x="3.6" dy="10">    so a floating GPIO (boot, crash, brown-out) equals relay OPEN.</tspan><tspan x="3.6" dy="10">  * GND is a common bus: tie both ESP32 GND pins together, join</tspan><tspan x="3.6" dy="10">    to PSU return, MAX31855 GND, and relay GND.</tspan><tspan x="3.6" dy="10" /><tspan x="3.6" dy="10">Cross-references</tspan><tspan x="3.6" dy="10">  Design-of-record schematic:  esp32_supervisor.svg</tspan><tspan x="3.6" dy="10">  Coil-circuit ladder:         ladder_coil_circuit.svg</tspan><tspan x="3.6" dy="10">  Mains one-line:              oneline_mains.svg</tspan><tspan x="3.6" dy="10">  Full wiring table:           WIRING.md</tspan><tspan x="3.6" dy="10">  Cable harness YAMLs:         ../harness/*.yml</tspan></text><circle cx="126" cy="-90" r="2.7" style="stroke:black;fill:black;stroke-width:2.0;stroke-dasharray:-;" /><circle cx="126" cy="-36" r="2.7" style="stroke:black;fill:black;stroke-width:2.0;stroke-dasharray:-;" /><circle cx="126" cy="18" r="2.7" style="stroke:black;fill:black;stroke-width:2.0;stroke-dasharray:-;" /><circle cx="126" cy="90" r="2.7" style="stroke:black;fill:black;stroke-width:2.0;stroke-dasharray:-;" /><circle cx="-126" cy="-90" r="2.7" style="stroke:black;fill:black;stroke-width:2.0;stroke-dasharray:-;" /><circle cx="-126" cy="-18" r="2.7" style="stroke:black;fill:black;stroke-width:2.0;stroke-dasharray:-;" /><circle cx="-126" cy="72" r="2.7" style="stroke:black;fill:black;stroke-width:2.0;stroke-dasharray:-;" /><circle cx="198" cy="-18" r="2.7" style="stroke:black;fill:black;stroke-width:2.0;stroke-dasharray:-;" /></svg>