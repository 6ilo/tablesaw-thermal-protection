p:round;stroke-linejoin:round;" /><path d="M 249.29999999999998,108.0 L 270,108" style="stroke:black;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 236.70000000000002,118.8 L 236.7,97.2" style="stroke:black;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 249.29999999999998,118.8 L 249.3,97.2" style="stroke:black;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 432.0,-0.0 L 452.7,-0" style="stroke:black;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 465.3,-0.0 L 486,-0" style="stroke:black;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 452.7,10.799999999999999 L 452.7,-10.8" style="stroke:black;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 465.3,10.799999999999999 L 465.3,-10.8" style="stroke:black;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 446.40000000000003,14.4 L 471.6,-14.4" style="stroke:black;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 540.0,-0.0 L 560.7,-0" style="stroke:black;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 573.3000000000001,-0.0 L 594,-0" style="stroke:black;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 560.6999999999999,10.799999999999999 L 560.7,-10.8" style="stroke:black;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 573.3000000000001,10.799999999999999 L 573.3,-10.8" style="stroke:black;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 648.0,-0.0 L 668.7,-0" style="stroke:black;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 681.3000000000001,-0.0 L 702,-0" style="stroke:black;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 668.6999999999999,10.799999999999999 L 668.7,-10.8" style="stroke:black;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 681.3000000000001,10.799999999999999 L 681.3,-10.8" style="stroke:black;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 662.4,14.4 L 687.6,-14.4" style="stroke:black;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 756.0,-0.0 L 768.6,-0" style="stroke:black;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 801.0,-0.0 L 813.6,-0" style="stroke:black;fill:none;stroke-width:2.0;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><text x="3.6" y="-90.19999999999999" dominant-baseline="central" fill="black" font-size="11" font-family="sans" text-anchor="end"><tspan x="3.6" dy="11">L1  (120 V hot)</tspan></text><text x="889.2" y="-90.19999999999999" dominant-baseline="central" fill="black" font-size="11" font-family="sans" text-anchor="end"><tspan x="889.2" dy="11">L2  (neutral / return)</tspan></text><text x="102.60000000000001" y="-50.6" dominant-baseline="central" fill="black" font-size="11" font-family="sans" text-anchor="middle"><tspan x="102.60000000000001" dy="11">STOP</tspan></text><text x="102.60000000000001" y="21.4" dominant-baseline="central" fill="black" font-size="11" font-family="sans" text-anchor="middle"><tspan x="102.60000000000001" dy="11">(NC pushbutton)</tspan></text><text x="246.6" y="-50.6" dominant-baseline="central" fill="black" font-size="11" font-family="sans" text-anchor="middle"><tspan x="246.6" dy="11">START</tspan></text><text x="246.6" y="21.4" dominant-baseline="central" fill="black" font-size="11" font-family="sans" text-anchor="middle"><tspan x="246.6" dy="11">(NO pushbutton)</tspan></text><text x="246.6" y="57.39999999999999" dominant-baseline="central" fill="black" font-size="11" font-family="sans" text-anchor="middle"><tspan x="246.6" dy="11">M1 aux</tspan></text><text x="246.6" y="129.4" dominant-baseline="central" fill="black" font-size="11" font-family="sans" text-anchor="middle"><tspan x="246.6" dy="11">(NO, seal-in)</tspan></text><text x="462.59999999999997" y="-50.6" dominant-baseline="central" fill="black" font-size="11" font-family="sans" text-anchor="middle"><tspan x="462.59999999999997" dy="11">TSTAT</tspan></text><text x="462.59999999999997" y="28.599999999999994" dominant-baseline="central" fill="black" font-size="11" font-family="sans" text-anchor="middle"><tspan x="462.59999999999997" dy="11">(NC, opens ~110°C)</tspan></text><text x="570.6" y="-50.6" dominant-baseline="central" fill="black" font-size="11" font-family="sans" text-anchor="middle"><tspan x="570.6" dy="11">KA</tspan></text><text x="570.6" y="23.099999999999994" dominant-baseline="central" fill="black" font-size="11" font-family="sans" text-anchor="middle"><tspan x="570.6" dy="11">(ESP32 relay NO,</tspan><tspan x="570.6" dy="11">active-HIGH)</tspan></text><text x="678.6" y="-50.6" dominant-baseline="central" fill="black" font-size="11" font-family="sans" text-anchor="middle"><tspan x="678.6" dy="11">OL</tspan></text><text x="678.6" y="21.4" dominant-baseline="central" fill="black" font-size="11" font-family="sans" text-anchor="middle"><tspan x="678.6" dy="11">(NC, overload)</tspan></text><text x="788.4000000000001" y="-50.6" dominant-baseline="central" fill="black" font-size="11" font-family="sans" text-anchor="middle"><tspan x="788.4000000000001" dy="11">M1</tspan></text><text x="788.4000000000001" y="21.4" dominant-baseline="central" fill="black" font-size="11" font-family="sans" text-anchor="middle"><tspan x="788.4000000000001" dy="11">(contactor coil)</tspan></text><text x="-50.4" y="-14.6" dominant-baseline="central" fill="black" font-size="11" font-family="sans" text-anchor="middle"><tspan x="-50.4" dy="11">Rung 1</tspan></text><text x="3.6" y="156.40000000000003" dominant-baseline="central" fill="#333" font-size="11" font-family="sans" text-anchor="start"><tspan x="3.6" dy="11">Fail-safe topology — after retrofit</tspan><tspan x="3.6" dy="11" /><tspan x="3.6" dy="11">  STOP (NC pb)  — opens rung on operator command  (fail-safe: broken wire = open = stopped)</tspan><tspan x="3.6" dy="11">  START (NO pb) — momentary; must be held until M1 aux seals it in</tspan><tspan x="3.6" dy="11">  M1 aux (NO)   — auxiliary contact on M1 contactor; carries the seal after START releases</tspan><tspan x="3.6" dy="11">                  (loss of coil power breaks the seal — motor cannot restart on its own)</tspan><tspan x="3.6" dy="11">  TSTAT (NC)    — passive bimetallic snap-action on winding; opens ~110°C, autoresets ~70°C</tspan><tspan x="3.6" dy="11">                  Wired IN SERIES with the rung — cuts coil independent of the ESP32.</tspan><tspan x="3.6" dy="11">  KA (NO)       — normally-open contact on the ESP32 relay module (opto-isolated, active-HIGH)</tspan><tspan x="3.6" dy="11">                  ESP32 must actively drive GPIO26 HIGH to close KA. Any of:</tspan><tspan x="3.6" dy="11">                    - ESP32 crash / brown-out / power loss  -&gt; GPIO26 floats -&gt; 10k pulldown -&gt; KA opens</tspan><tspan x="3.6" dy="11">                    - Firmware trip on winding overtemp     -&gt; firmware drives GPIO26 LOW  -&gt; KA opens</tspan><tspan x="3.6" dy="11">                    - Loss of thermocouple                  -&gt; firmware trips              -&gt; KA opens</tspan><tspan x="3.6" dy="11">                  Any KA-open drops the coil.</tspan><tspan x="3.6" dy="11">  OL (NC)       — overload relay auxiliary; opens on sustained overcurrent, drops coil</tspan><tspan x="3.6" dy="11">  M1            — Gould/ITE A202C NEMA Size 1 contactor coil, 120 V</tspan><tspan x="3.6" dy="11" /><tspan x="3.6" dy="11">SR-3: TSTAT and KA are IN SERIES. Either one open == coil de-energized == motor stopped.</tspan><tspan x="3.6" dy="11">SR-4: No autonomous restart. After the coil drops, the seal-in is broken; a human must press START.</tspan></text><circle cx="162" cy="-0" r="2.7" style="stroke:black;fill:black;stroke-width:2.0;stroke-dasharray:-;" /><circle cx="378" cy="-0" r="2.7" style="stroke:black;fill:black;stroke-width:2.0;stroke-dasharray:-;" /></svg>