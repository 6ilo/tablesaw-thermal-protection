troke-linejoin:round;" /><path d="M 684.0,270.0 L 342,270 L 0,270" style="stroke:black;fill:none;stroke-width:2;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 0.0,270.0 L 0,135 L 0,-0" style="stroke:black;fill:none;stroke-width:2;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 414.0,154.79999999999998 L 414,212.4 L 414,270" style="stroke:black;fill:none;stroke-width:2;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><text x="-7.199999999999999" y="-36.599999999999994" dominant-baseline="central" fill="black" font-size="10" font-family="sans" text-anchor="end"><tspan x="-7.199999999999999" dy="10">Utility</tspan><tspan x="-7.199999999999999" dy="10">240 V, 1Φ</tspan></text><circle cx="112.32" cy="-0" r="4.32" style="stroke:black;fill:white;stroke-width:2.0;stroke-dasharray:-;" /><circle cx="139.68" cy="-0" r="4.32" style="stroke:black;fill:white;stroke-width:2.0;stroke-dasharray:-;" /><text x="129.6" y="-74.0" dominant-baseline="central" fill="black" font-size="10" font-family="sans" text-anchor="middle"><tspan x="129.6" dy="10">DISC</tspan><tspan x="129.6" dy="10">(fused disconnect,</tspan><tspan x="129.6" dy="10">lockable)</tspan></text><text x="219.6" y="-74.0" dominant-baseline="central" fill="#666" font-size="10" font-family="sans" text-anchor="middle"><tspan x="219.6" dy="10">retrofit tap</tspan><tspan x="219.6" dy="10">(load side of DISC,</tspan><tspan x="219.6" dy="10">line side of M1)</tspan></text><text x="309.59999999999997" y="-61.800000000000004" dominant-baseline="central" fill="black" font-size="10" font-family="sans" text-anchor="middle"><tspan x="309.59999999999997" dy="10">30 A</tspan><tspan x="309.59999999999997" dy="10">(motor branch)</tspan></text><circle cx="418.32" cy="-0" r="4.32" style="stroke:black;fill:white;stroke-width:2.0;stroke-dasharray:-;" /><circle cx="445.68" cy="-0" r="4.32" style="stroke:black;fill:white;stroke-width:2.0;stroke-dasharray:-;" /><text x="435.59999999999997" y="-74.0" dominant-baseline="central" fill="black" font-size="10" font-family="sans" text-anchor="middle"><tspan x="435.59999999999997" dy="10">M1</tspan><tspan x="435.59999999999997" dy="10">(contactor,</tspan><tspan x="435.59999999999997" dy="10">NEMA Size 1)</tspan></text><text x="435.59999999999997" y="29.599999999999994" dominant-baseline="central" fill="#666" font-size="10" font-family="sans" text-anchor="middle"><tspan x="435.59999999999997" dy="10">(driven by coil circuit)</tspan></text><text x="561.6" y="-61.800000000000004" dominant-baseline="central" fill="black" font-size="10" font-family="sans" text-anchor="middle"><tspan x="561.6" dy="10">OL</tspan><tspan x="561.6" dy="10">(overload heater)</tspan></text><text x="723.6" y="-25.0" dominant-baseline="central" fill="black" font-size="10" font-family="sans" text-anchor="start"><tspan x="723.6" dy="10">M</tspan><tspan x="723.6" dy="10">3 HP  14.4 A</tspan><tspan x="723.6" dy="10">145TC TEFC</tspan><tspan x="723.6" dy="10">Class F</tspan></text><text x="273.59999999999997" y="89.39999999999999" dominant-baseline="central" fill="black" font-size="10" font-family="sans" text-anchor="middle"><tspan x="273.59999999999997" dy="10">250 mA</tspan><tspan x="273.59999999999997" dy="10">(control fuse)</tspan></text><text x="387.0" y="146.6" dominant-baseline="hanging" fill="black" font-size="10" font-family="sans" text-anchor="middle"><tspan x="387.0" dy="10">Isolated AC-DC PSU</tspan><tspan x="387.0" dy="10">120 V AC → 5 V DC</tspan><tspan x="387.0" dy="10">(Mean Well IRM-05-5</tspan><tspan x="387.0" dy="10">or Recom RAC03-05SK)</tspan></text><text x="547.1999999999999" y="120.4" dominant-baseline="central" fill="#d62728" font-size="10" font-family="sans" text-anchor="start"><tspan x="547.1999999999999" dy="10">+5V DC</tspan><tspan x="547.1999999999999" dy="10">(SELV)</tspan><tspan x="547.1999999999999" dy="10">=&gt; ESP32 supervisor</tspan></text><text x="329.40000000000003" y="270.8" dominant-baseline="central" fill="black" font-size="10" font-family="sans" text-anchor="middle"><tspan x="329.40000000000003" dy="10">L2</tspan></text><text x="3.6" y="201.59999999999997" dominant-baseline="ideographic" fill="#333" font-size="10" font-family="sans" text-anchor="start"><tspan x="3.6" dy="10">What changed vs. OEM Powermatic:</tspan><tspan x="3.6" dy="10">  • Klixon BEC2921 removed from motor internal circuit</tspan><tspan x="3.6" dy="10">      (was: manual-reset thermal in series with winding lead)</tspan><tspan x="3.6" dy="10">  • Passive bimetallic thermostat  → wired into coil circuit  (see ladder_coil_circuit.svg)</tspan><tspan x="3.6" dy="10">  • ESP32 supervisor relay (KA)    → wired into coil circuit in series with the thermostat</tspan><tspan x="3.6" dy="10">  • Control-supply tap             → 250 mA fuse + isolated AC-DC PSU feeds the ESP32 at 5 V DC</tspan><tspan x="3.6" dy="10" /><tspan x="3.6" dy="10">Isolation:</tspan><tspan x="3.6" dy="10">  • PSU input:     reinforced (UL 61010 / IEC 60950 rated part)</tspan><tspan x="3.6" dy="10">  • PSU output:    SELV; ESP32 side referenced to enclosure ground</tspan><tspan x="3.6" dy="10">  • ESP32 → coil:  opto-input + contact-gap on the relay module (double isolation)</tspan><tspan x="3.6" dy="10">  • TC at winding: AlN dielectric substrate</tspan><tspan x="3.6" dy="10" /><tspan x="3.6" dy="10">Not shown on this drawing:</tspan><tspan x="3.6" dy="10">  • 3-wire seal-in start/stop network        → ladder_coil_circuit.svg</tspan><tspan x="3.6" dy="10">  • ESP32 board-level wiring                 → esp32_supervisor.svg</tspan><tspan x="3.6" dy="10">  • Motor-side sensor pigtail (TC + TSTAT)   → ../harness/motor_pigtail.yml</tspan><tspan x="3.6" dy="10">  • Enclosure interior wiring                → ../harness/mains_and_coil.yml</tspan></text><circle cx="216" cy="-0" r="2.7" style="stroke:black;fill:black;stroke-width:2.0;stroke-dasharray:-;" /><circle cx="414" cy="270" r="2.7" style="stroke:black;fill:black;stroke-width:2.0;stroke-dasharray:-;" /></svg>